map $http_upgrade $df_connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=df_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=df_api:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name 91.98.64.49;
    server_tokens off;
    root /var/www/dead-frequency;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://91.98.64.49$request_uri; }
}
server {
    listen 443 ssl;
    server_name 91.98.64.49;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/91.98.64.49/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/91.98.64.49/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    # Invitations contain short-lived room secrets: do not write URLs to logs.
    access_log off;
    location /api/auth/ {
        limit_req zone=df_auth burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=df_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location = /coop {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $df_connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location / { default_type text/plain; return 200 'DEAD FREQUENCY — Spielserver\nVerbindung und Accounts direkt im Spiel öffnen.\n'; }
}
